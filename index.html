<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>24点游戏</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game">
    <header class="header">
      <h1>24点游戏</h1>
      <p class="subtitle">用下面 4 个数字，通过 + − × ÷ 和括号，凑成 24</p>
    </header>

    <div class="stats">
      <div class="stat"><span class="label">得分</span><span id="score">0</span></div>
      <div class="stat"><span class="label">连对</span><span id="streak">0</span></div>
    </div>

    <div class="workspace">
      <section class="numbers">
        <div class="cards" id="cards"></div>
        <div class="actions">
          <button class="btn action" id="newRound">换一题</button>
          <button class="btn action" id="showAnswer">看答案</button>
          <button class="btn action danger" id="reset">重新开始</button>
        </div>
      </section>

      <section class="calc">
        <input id="expression" type="text" placeholder="点击这里，直接输入或修改算式" autocomplete="off" spellcheck="false">
        <div class="ops">
          <button class="btn op" data-op="+">+</button>
          <button class="btn op" data-op="-">−</button>
          <button class="btn op" data-op="×">×</button>
          <button class="btn op" data-op="÷">÷</button>
        </div>
        <div class="tools">
          <button class="btn tool" data-op="(">(</button>
          <button class="btn tool" data-op=")">)</button>
          <button class="btn tool" id="backspace">⌫</button>
          <button class="btn tool danger" id="clear">清空</button>
        </div>
        <button class="btn submit" id="submit">= 24，确认</button>
      </section>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
